#http_dir /home/mitra/github_mitra42/frugal-iot/html
# Kept under /var/lib/mosquitto, which belongs to the mosquitto user, rather than /etc/mosquitto,
# which belongs to root. Both the broker and mosquitto_passwd warn unless the file belongs to
# whoever opened it, and mosquitto_passwd also writes a temporary backup beside it, so the
# directory has to be writable by that same user. See INSTALLATION.md step A5.
password_file /var/lib/mosquitto/passwords

# A node on a weak WiFi signal reconnects often, and each connection and disconnection is a line in
# /var/log/mosquitto/mosquitto.log. On an SD card those writes wear the card out, and nothing is
# lost by dropping them, since the readings themselves are logged by the server. Uncomment to stop
# them being recorded. Everything else the broker reports, including why it refused to start, is
# unaffected - that log is the only place some of those failures appear, so it stays.
#connection_messages false